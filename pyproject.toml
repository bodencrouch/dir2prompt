[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=67.8.0",
  "wheel",
]

[dependency-groups]
dev = [
  "autoflake>=2.3.1",
  "bandit>=1.7.0",
  "black>=24.0.0",
  "isort>=5.13.0",
  "mccabe>=0.7.0",
  "mypy>=1.10.0",
  "mypy-extensions>=1.0.0",
  "pyflakes>=3.2.0",
  "pylint>=3.2.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.5.3",
  "tomli>=2.0.0; python_version < \"3.11\"",
  "tomli-w>=1.0.0",
  "typing-extensions>=4.12.0",
  "yapf>=0.40.0",
]

[project]
name = "dir2prompt"
authors = [
  { name = "Nicolas Girard", email = "girard.nicolas@gmail.com" },
]
maintainers = [
  { name = "Nicolas Girard", email = "girard.nicolas@gmail.com" },
]
dependencies = []
description = "Generate an LLM-friendly snapshot of a directory's structure and file contents."
dynamic = ["version"]
keywords = [
  "ai",
  "cli",
  "codebase",
  "directory",
  "llm",
  "prompt",
  "repository",
  "snapshot",
]
license = { text = "MIT" }
readme = { content-type = "text/markdown", file = "README.md" }
requires-python = ">=3.8"

[project.scripts]
d2p = "dir2prompt.__main__:main"
dir2prompt = "dir2prompt.__main__:main"

[project.urls]
documentation = "https://github.com/ngirard/dir2prompt/blob/main/README.md"
homepage = "https://github.com/ngirard/dir2prompt"
issues = "https://github.com/ngirard/dir2prompt/issues"
repository = "https://github.com/ngirard/dir2prompt.git"
changelog = "https://github.com/ngirard/dir2prompt/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dir2prompt_uvx*"]

[tool.setuptools.package-data]
dir2prompt_uvx = [
  "dir2prompt.sh",
]

[tool.setuptools.dynamic]
version = { file = ["version"] }


########################################################
## define only linter configurations below this point ##
########################################################

[tool.bandit]
exclude_dirs = [
  "build",
  "dist",
  "tests",
]
skips = [
  "B101",
]
tests = [
  "B201",
  "B301",
]

[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.github
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | __pycache__
  | dist
  | \.history
  | \.idea
  | \.chat
  | \.ruff_cache
  | \.trunk
)/
'''
include = '\.pyi?$'
line-length = 100
skip-magic-trailing-comma = false
target-version = ["py38"]

[tool.isort]
atomic = true
line_length = 100
multi_line_output = 3
profile = "black"
skip_gitignore = true

[tool.mccabe]
max-complexity = 25

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
  '\.mypy_cache',
  '\.pytest_cache',
  '\.venv',
  "__pycache__",
  "build",
  "dist",
  "tests/fixtures",
  "venv",
]
explicit_package_bases = true
mypy_path = [
  "src",
  "tests",
]
namespace_packages = true
no_implicit_optional = true
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pylintrc]
max-line-length = 100

[tool.pylint.MASTER]
ignore-paths = [
  "^\\.venv/.*$",
  "^build/.*$",
  "^dist/.*$",
  "^tests/fixtures/.*$",
  "^vendor/.*$",
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "duplicate-code",
]
max-line-length = 100

[tool.pyright]
analyzeUnannotatedFunctions = true
deprecateTypingAliases = false
exclude = [
  "**/.*/**",
  "**/.venv/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/tests/fixtures/**",
  "**/vendor/**",
  "**/venv/**",
]
extraPaths = [
  "src",
]
include = [
  "src/**/*.py",
  "tests/**/*.py",
]
pythonVersion = "3.8"
reportMissingImports = true
reportMissingTypeStubs = false
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "-ra -q"
log_cli = true
log_cli_format = "%(message)s"
log_cli_level = "CRITICAL"
log_file = "pytest.log"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_level = "DEBUG"
testpaths = [
  "tests",
]
timeout = 120
timeout_method = "thread"

[tool.ruff]
fix = true
force-exclude = true
line-length = 100
output-format = "grouped"
preview = false
respect-gitignore = false
show-fixes = true
src = [
  "src",
  "tests",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
preview = false
skip-magic-trailing-comma = false

[tool.ruff.lint]
exclude = [
  ".venv",
  ".venv*",
  "build",
  "dist",
  "tests/fixtures",
]
external = ["V"]
ignore = [
  "ANN002",
  "ANN003",
  "ANN101",
  "ANN102",
  "ANN204",
  "ANN401",
  "ARG002",
  "BLE001",
  "C901",
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D205",
  "D401",
  "D413",
  "D417",
  "E402",
  "EM101",
  "EM102",
  "ERA001",
  "G004",
  "ISC001",
  "PERF203",
  "PLC0415",
  "PLR0904",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "RET504",
  "RUF100",
  "S101",
  "SIM108",
  "SIM114",
  "T201",
  "TD001",
  "TRY003",
]
task-tags = [
  "FIXME",
  "HACK",
  "TODO",
]
unfixable = [
  "ERA001",
  "F841",
  "RUF100",
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "list"
parametrize-values-row-type = "list"
parametrize-values-type = "list"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = [
  "typing",
  "typing_extensions",
]
quote-annotations = true
strict = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = false
lines-between-types = 1
required-imports = [
  "from __future__ import annotations",
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
  "I002",
]
".github/*py" = [
  "INP001",
]
"__init__.py" = [
  "F401",
  "I001",
  "I002",
  "TID252",
]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 200

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.style]
based_on_style = "google"
split_arguments_when_comma_terminated = true
split_before_named_assigns = true
split_complex_comprehension = true

[tool.yapf]
ALLOW_SPLIT_BEFORE_DEFAULT_OR_NAMED_ASSIGNS = false
ALLOW_SPLIT_BEFORE_DICT_VALUE = false
DISABLE_SPLIT_LIST_WITH_COMMENT = true
INDENT_DICTIONARY_VALUE = true
column_limit = 175
join_multiple_lines = false
no_spaces_around_selected_binary_operators = "*,/"
split_before_dict_set_generator = true
split_before_expression_after_opening_paren = false
split_complex_comprehension = true
split_penalty_after_opening_bracket = 50
split_penalty_excess_character = 75
split_penalty_for_added_line_split = 100
